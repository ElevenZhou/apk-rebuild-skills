; Godot 4.6 Android 导出 preset 示例（项目 D 验证通过）
; 复制为工程根目录 export_presets.cfg，替换 <> 占位。
; 注意：密码不要提交到仓库——建议 export_presets.cfg 加入 .gitignore，或导出前由本地脚本注入。

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.yaml"
exclude_filter="tests_dev/*"
export_path="C:/build/<app>.apk"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="<com.company.app>"
package/name="<AppName>"
package/signed=true
package/app_category=2
screen/immersive_mode=true
user_data_backup/allow=false
; debug 三元组：全空 = 使用 editor_settings 里的 debug keystore
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
; release 三元组：必须全填
keystore/release="C:/keystores/<app>-release.keystore"
keystore/release_user="<alias>"
keystore/release_password="<password>"
